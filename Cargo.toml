[workspace]
resolver = "3"
members = [
    "crates/op_kernel",
    "crates/op_sim",
    "crates/op_replay",
    "crates/op_world",
    "crates/op_stream",
    "crates/op_client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AndromedaSLS/StreetWide"
authors = ["The StreetWide contributors"]
publish = false

[workspace.dependencies]
# Workspace crates. Which crate may depend on which is fixed by ADR-0002 and
# checked in CI by tools/ci/check_deps.py against tools/ci/deps-policy.toml.
op_kernel = { path = "crates/op_kernel" }
op_sim = { path = "crates/op_sim" }
op_stream = { path = "crates/op_stream" }
op_world = { path = "crates/op_world" }

# Deterministic transcendental functions (pure Rust, identical on every
# platform). Simulation code calls them through op_kernel::dmath (ADR-0003).
libm = "0.2.16"

# World format (RFC 0001). Never enable serde_json's `preserve_order` or
# `arbitrary_precision`: canonical JSON relies on plain integers.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"
# Dev-only: checks that the JSON Schemas and the Rust types agree. No network
# features (its defaults pull in an HTTP client and aws-lc-rs).
jsonschema = { version = "0.63.0", default-features = false }

# Engine pins (ADR-0005). Exact versions on purpose: bump them only in a
# dedicated PR that updates the ADR and re-records the determinism fixtures.
bevy = { version = "=0.20.1", default-features = false }
# `enhanced-determinism` makes Rapier use scalar math and libm so results are
# bit-identical across platforms. Never drop it (ADR-0003).
rapier3d = { version = "=0.36.1", default-features = false, features = [
    "dim3",
    "f32",
    "std",
    "enhanced-determinism",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Determinism bans are configured in clippy.toml; make them hard errors even
# without `-D warnings`.
disallowed_types = "deny"
disallowed_methods = "deny"

[profile.dev]
# Keep debug builds playable: optimise dependencies (Bevy, Rapier), not our code.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
