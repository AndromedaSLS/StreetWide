name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Only refresh dependency caches from main, so PRs cannot evict them.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Contribution tool output passes the full gate
        run: |
          python -m pip install -r tools/requirements.txt
          FEATURE=$(python -c "import json; print(json.load(open('fixtures/changes/facade-sample/change.json'))['changes'][0]['feature_id'])")
          MODEL=$(ls fixtures/changes/facade-sample/objects/*/*.glb)
          python -m tools.contrib facade --world fixtures/world --building "$FEATURE" --model "$MODEL" --author github:ci --title "CI facade" --rationale "Tool-to-gate check in CI." --derived-from-shell --out target/ci-facade
          cargo run -p op_replay --locked -- check-change fixtures/world target/ci-facade --replay fixtures/replays/sample.oprep

  determinism:
    # Cross-platform determinism: the Rapier canary (golden digest), the
    # world-format golden ids and the fixture replay's hash trail must be
    # identical on every OS (x86_64 Linux and Windows, arm64 macOS). Never
    # weaken or skip this job to get CI green (CLAUDE.md); find the cause.
    name: determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Rapier canary (debug)
        run: cargo test -p op_sim --locked --test rapier_canary
      - name: Rapier canary (release)
        run: cargo test -p op_sim --locked --release --test rapier_canary
      - name: World-format golden ids
        run: cargo test -p op_world --locked --test format_fixtures --test glb_profile --test cjson_rules --test ingest_fixture --test gate --test contrib_schemas
      - name: Validate the format fixture world
        run: cargo run -p op_world --locked -- validate fixtures/format/world
      - name: Validate the ingest fixture world
        run: cargo run -p op_world --locked -- validate fixtures/world
      - name: Contribution gate on the sample change set
        run: cargo run -p op_world --locked -- check-change fixtures/world fixtures/changes/facade-sample
      - name: Kernel, simulation and replay tests (pinned bits, sample replay)
        run: cargo test -p op_kernel -p op_sim -p op_stream -p op_replay --locked
      # The replay check runs twice, in separate processes, and once more in
      # release: every run must reproduce all recorded checkpoints.
      - name: Replay check (debug, run 1)
        run: cargo run -p op_replay --locked -- check fixtures/replays/sample.oprep
      - name: Replay check (debug, run 2)
        run: cargo run -p op_replay --locked -- check fixtures/replays/sample.oprep
      - name: Replay check (release)
        run: cargo run -p op_replay --locked --release -- check fixtures/replays/sample.oprep

  python:
    name: python tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m pytest

  gltf:
    name: glTF validator (Khronos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate every committed .glb
        working-directory: tools/ci/gltf
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  deps:
    name: dependency direction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/ci/check_deps.py

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every new commit is signed off
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/check_dco.py "$BASE" "$HEAD"
